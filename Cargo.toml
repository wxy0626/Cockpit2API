[workspace]
members = [
    "src-tauri",
    "crates/cockpit-core",
    "crates/cockpit-cli",
]
resolver = "2"

[workspace.dependencies]
# Common dependencies with shared versions
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1.0"
thiserror = "2"
chrono = "0.4"
dirs = "5.0"
reqwest = { version = "0.12", features = ["json", "gzip", "brotli", "deflate", "zstd", "stream"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
uuid = { version = "1.10", features = ["v4", "serde"] }
url = "2.5"
regex = "1"
futures = "0.3"
sysinfo = "0.33"
rusqlite = { version = "0.32", features = ["bundled"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "time"] }
tracing-appender = "0.2"
tracing-log = "0.2"
trash = "5"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
mac-notification-sys = "0.6"
tauri-plugin-notification = "2"
rand = "0.8"
sha2 = "0.10"
tokio-tungstenite = "0.26"
futures-util = "0.3"
rustls = "0.23"
rcgen = "0.13"
tokio-rustls = "0.26"
libc = "0.2"
aes = "0.8"
aes-gcm = "0.10"
cbc = "0.1"
pbkdf2 = "0.12"
sha1 = "0.10"
tiny_http = "0.12"
rsa = "0.9"
serde_urlencoded = "0.7"
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
junction = "2.0"

[profile.release]
# 构建提速（关键项）：release 默认关闭增量编译。开启后，前端 dist 变化触发
# tauri-build 重跑时，src-tauri 大部分 CGU（代码生成单元）可复用缓存，
# 只有嵌入了新资源的模块重编，显著缩短「纯前端改动后的构建」耗时。
incremental = true
# 剥离符号表：显著减小 exe 体积（86MB 起），链接写入更快，分发更小。
# 代价：release 崩溃时拿不到符号名（日常使用无影响）。
strip = "symbols"
# 编译提速：opt 3→2（桌面工具运行时几乎无感），codegen-units 16→256
# 把代码切成更多并行编译单元，20 核机器吃得满。两者叠加让全量构建的
# 主 crate 编译明显变快；代价是运行时性能轻微下降（对本工具无感）。
opt-level = 2
codegen-units = 256
